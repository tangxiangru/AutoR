[pytest]
# Do not load hydra's pytest plugin. AutoR does not use hydra or omegaconf anywhere --
# the only grep hit in the tree is the word "rehydrate" in a docstring -- but hydra-core
# registers `hydra_pytest` as a `pytest11` entry point, so pytest imports it at startup
# whether or not anything wants it.
#
# That import currently kills the whole suite before a single test is collected:
#
#     hydra/__init__.py -> omegaconf/_utils.py -> omegaconf/grammar_parser.py
#     antlr4/atn/ATNDeserializer.py:50
#     Exception: Could not deserialize ATN with version  (expected 4)
#
# omegaconf 2.3.1 and hydra-core 1.3.5 both declare `antlr4-python3-runtime==4.9.*`; the
# shared interpreter has 4.11.1, so their generated parsers cannot read their own ATN. The
# environment violates a constraint its own packages state.
#
# Fixed here rather than in the environment on purpose. That interpreter is shared with
# around ten benchmark workloads running right now, including a paired ablation whose two
# arms must not drift apart, and downgrading a transitive dependency underneath them to
# repair a test runner they do not use is the wrong trade. This costs nothing: no test in
# this repository asks for the hydra fixture.
#
# GitHub CI is unaffected either way -- `.github/workflows/ci.yml` runs
# `python -m unittest` on a clean 3.12 and does not load pytest plugins at all.
addopts = -p no:hydra_pytest
